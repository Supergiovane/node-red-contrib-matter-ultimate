## Documentación

Los nodos funcionan directamente con mensajes Node-RED: `msg.topic` identifica la función y `msg.payload` contiene su valor. KNX Ultimate no es necesario.

Selecciona la configuración bridge y el tipo de dispositivo y activa los pines. Los mensajes entrantes en los **topics de estado** actualizan el dispositivo virtual; los comandos de la app Matter salen por los **topics de comando**. En **Modo KNX**, los comandos de la app se escriben en las direcciones de grupo de comando y las direcciones de estado KNX actualizan la app.

Ejemplo: `msg.topic = "living-room/light/status"`, `msg.payload = true` indica que la lámpara está encendida. Un comando de la app sale por `msg.topic = "living-room/light/command"` con payload booleano. Conéctalo a la lógica del dispositivo real y devuelve el estado confirmado.

Activa los pines de entrada/salida e introduce nombres de topics en los campos de comando y estado. Deja vacío el gateway KNX; los campos DPT se ocultan porque no son necesarios. Usa topics distintos para comandos y estados. La coincidencia debe ser exacta; no se admiten comodines.

### Modo KNX

**También puedes usar este paquete con KNX Ultimate.** La integración es nativa: instala `node-red-contrib-knx-ultimate` y selecciona su gateway para activar el **Modo KNX**. Los mismos campos usan entonces direcciones de grupo y DPT, con sugerencias del proyecto ETS importado. Comandos y estados pasan directamente por el bus; no hacen falta nodos Function intermedios para estas asignaciones.

Al seleccionar un gateway, sustituye los topics guardados por direcciones de grupo reales y elige los DPT correctos. Si el gateway seleccionado está desconectado, el nodo permanece en Modo KNX. Para volver a los mensajes Node-RED, quita la selección del gateway y configura de nuevo los topics.

[Nodos](https://supergiovane.github.io/node-red-contrib-matter-ultimate/es/nodes.html) · [Ejemplos](https://supergiovane.github.io/node-red-contrib-matter-ultimate/es/examples.html)

## Descripción general

Cada nodo de dispositivo Matter Bridge expone un dispositivo gestionado por tu flow Node-RED como dispositivo Matter. Selecciona una configuración **Matter Bridge**, empareja el bridge en tu app Matter y conecta sus entradas/salidas a la lógica del dispositivo. Varios nodos de dispositivo pueden compartir el bridge.

**Matter Controller** envía comandos a dispositivos Matter reales. **Matter Bridge** expone dispositivos de tu flow a una app Matter. También puedes conectar ambos a KNX mediante KNX Ultimate.

Cambiar el tipo de dispositivo después de emparejar el bridge modifica la estructura del endpoint Matter. Los controladores pueden conservar el endpoint antiguo como no alcanzable; en ese caso, restablece/vuelve a emparejar el bridge o crea un nuevo dispositivo expuesto.

## Configuración

Las direcciones de grupo y DPT que se indican a continuación se aplican al **Modo KNX**. Para mensajes Node-RED, usa nombres de topics en los mismos campos de comando/estado; no se necesitan DPT.

|Campo|Descripción|
|--|--|
| Bridge Matter | El nodo de configuración Bridge Matter al que pertenece este dispositivo |
| GW KNX | Déjalo vacío para mensajes Node-RED. Selecciona un gateway KNX Ultimate para activar el Modo KNX con direcciones de grupo y DPT. |
| Nombre | Lo que Alexa y cía. muestran y usan para los comandos de voz |
| Tipo de dispositivo | El tipo de dispositivo Matter (ver abajo); determina qué campos de dirección de grupo aparecen |
| Leer estado al inicio | Envía un `GroupValue_Read` a las GA de estado al inicio, para poblar los atributos Matter |

## Tipos de dispositivo y direcciones de grupo

|Tipo|Direcciones de grupo|
|--|--|
| Luz On/Off, Enchufe | GA comando On/Off, GA estado On/Off (DPT 1.001) |
| Luz regulable | + GA comando/estado regulación % (DPT 5.001) |
| Luz RGB (color) | + GA comando/estado color RGB (DPT 232.600). El color Matter (hue/saturation o XY, de la rueda de color de la app) se convierte desde/hacia la terna RGB KNX |
| Luz blanco dinámico | + GA comando/estado temperatura de color en Kelvin (DPT 7.600) |
| Persiana / Cortina | Subir/Bajar (DPT 1.008), Stop (DPT 1.017), posición % comando/estado (DPT 5.001), inversión de posición opcional |
| Termostato (calefacción y/o refrigeración) | GA temperatura actual, GA comando/estado consigna (DPT 9.001). Añadiendo también la GA comando/estado consigna de refrigeración se expone también el modo Cool (doble consigna) |
| Aire acondicionado de habitación | Un dispositivo Matter combina GA comando/estado On/Off (DPT 1.001), temperatura actual y consignas de calefacción/refrigeración (DPT 9.001), y velocidad del ventilador % (DPT 5.001) |
| Ventilador / VMC | GA comando/estado velocidad % (DPT 5.001) |
| Cerradura de puerta | GA comando bloqueo/desbloqueo y GA estado bloqueado/desbloqueado (DPT 1.001; `true` = bloqueada) |
| Sensores (temperatura, humedad, luz, presencia, contacto) | Una GA de estado cada uno |
| Alarma humo/CO | GA estado alarma de humo + GA estado alarma CO opcional (DPT 1.005): notificaciones críticas en el teléfono |
| Detector de fugas de agua | GA estado fuga (DPT 1.005) |
| Sensor de calidad del aire (CO2) | GA estado CO2 en ppm (DPT 9.008); la clase de calidad del aire (buena/regular/moderada/mala...) se deriva automáticamente |
| Robot aspirador | **Solo-flow**: sin direcciones de grupo. Habilita los PINes del nodo: los comandos del asistente ("inicia la limpieza", pausa/reanudar/volver a la base) llegan a la salida como `rvcmode`/`rvccommand`; informa el estado con `msg.payload = { function: "rvcstate", value: "running"\|"docked"\|"charging"\|"paused"\|"error" }` y el modo con `function: "rvcmode", value: "cleaning"\|"idle"` |

- **GA de comando**: se escribe en el bus KNX cuando el asistente envía un comando.
- **GA de estado**: se lee del bus para mantener actualizados los atributos Matter (y las apps).

## Compatibilidad avanzada

Estas opciones solo aparecen cuando tienen sentido para el tipo seleccionado. Los dispositivos regulables pueden ignorar el brillo enviado justo después de `On`. Para persianas, **Intercambiar Abrir / Cerrar** invierte el comando KNX binario y la dirección porcentual. **Antirrebote del deslizador** agrupa objetivos intermedios rápidos antes de escribir en KNX: `0` usa ventanas adaptativas (400 ms para el primer comando y 150 ms para los siguientes); `1`–`5000` fuerza una ventana fija. La posición Matter también puede actualizarse de forma optimista y corregirse después mediante la GA de estado KNX.

## PINes del nodo

El selector de PINes está fuera de las pestañas del editor. Al activarlo aparece justo debajo una sección contextual **Entrada/salida del flow**, con ejemplos copiables filtrados según el tipo de dispositivo:

- **Entrada**: actualiza el estado Matter desde el flow, sin pasar por el bus KNX: `msg.payload = { function: "onoff", value: true }` (`function` es una de `onoff`, `level`, `rgb`, `colortemp`, `position`, `temperature`, `humidity`, `illuminance`, `occupancy`, `contact`, `currenttemp`, `setpoint`, `coolingsetpoint`, `fanspeed`, `lock`, `smoke`, `co`, `leak`, `co2`, `rvcstate`, `rvcmode`). Útil para exponer a Alexa y cía. valores calculados en el flow (p.ej. un sensor virtual).
- **Salida**: cada comando recibido de un controlador Matter se reenvía al flow: `msg.topic` = nombre del dispositivo, `msg.payload` = valor, `msg.matter` = el comando en bruto. Un dispositivo sin GA de comando se convierte en un **dispositivo solo-flow**.

## Notas

- La identidad Matter del dispositivo está ligada a este nodo: si borras el nodo y creas uno nuevo, las apps ven un dispositivo completamente nuevo.
- Los nodos de dispositivo añadidos/renombrados/eliminados se detectan en pocos segundos, sin volver a emparejar el bridge.
