## Documentation

Les nœuds fonctionnent directement avec les messages Node-RED : `msg.topic` identifie la fonction et `msg.payload` contient sa valeur. KNX Ultimate n’est pas nécessaire.

Sélectionnez la configuration bridge et le type d’appareil, puis activez les ports. Les entrées sur les **topics d’état** actualisent l’appareil virtuel ; les commandes de l’app Matter sortent sur les **topics de commande**. En **Mode KNX**, les commandes de l’app sont écrites sur les adresses de groupe de commande et les adresses d’état KNX actualisent l’app.

Exemple : `msg.topic = "living-room/light/status"`, `msg.payload = true` signale une lampe allumée. Une commande de l’app sort sur `msg.topic = "living-room/light/command"` avec un payload booléen. Reliez-la à votre appareil réel et renvoyez son état confirmé.

Activez les entrées/sorties et saisissez les noms des topics dans les champs de commande et d’état. Laissez la passerelle KNX vide ; les champs DPT sont masqués car ils ne sont pas nécessaires. Utilisez des topics distincts pour les commandes et les états. La correspondance doit être exacte, sans caractères génériques.

### Mode KNX

**Vous pouvez aussi utiliser ce package avec KNX Ultimate.** L’intégration est native : installez `node-red-contrib-knx-ultimate` et sélectionnez sa passerelle pour activer le **Mode KNX**. Les mêmes champs utilisent alors des adresses de groupe et des DPT, avec des suggestions du projet ETS importé. Commandes et états passent directement par le bus ; aucun nœud Function intermédiaire n’est nécessaire pour ces correspondances.

En sélectionnant une passerelle, remplacez les topics enregistrés par de vraies adresses de groupe et choisissez les DPT appropriés. Une passerelle sélectionnée mais hors ligne laisse le nœud en Mode KNX. Pour revenir aux messages Node-RED, retirez la passerelle et configurez à nouveau les topics.

[Nœuds](https://supergiovane.github.io/node-red-contrib-matter-ultimate/fr/nodes.html) · [Exemples](https://supergiovane.github.io/node-red-contrib-matter-ultimate/fr/examples.html)

## Vue d'ensemble

Chaque nœud appareil Matter Bridge expose un appareil géré par votre flow Node-RED comme appareil Matter. Sélectionnez une configuration **Matter Bridge**, associez ce bridge à votre app Matter et reliez les entrées/sorties à la logique de votre appareil. Plusieurs nœuds appareil peuvent partager le bridge.

**Matter Controller** envoie des commandes aux appareils Matter réels. **Matter Bridge** expose les appareils de votre flow à une app Matter. Vous pouvez aussi relier les deux à KNX via KNX Ultimate.

Changer le type d'appareil après l'appairage du bridge modifie la structure de l'endpoint Matter. Les contrôleurs peuvent conserver l'ancien endpoint comme injoignable ; dans ce cas, réinitialisez/réappairez le bridge ou créez un nouvel appareil exposé.

## Configuration

Les adresses de groupe et DPT ci-dessous concernent le **Mode KNX**. Pour les messages Node-RED, utilisez des noms de topics dans les mêmes champs de commande/état ; les DPT ne sont pas nécessaires.

|Champ|Description|
|--|--|
| Bridge Matter | Le nœud de configuration Bridge Matter auquel appartient cet appareil |
| GW KNX | Laissez vide pour les messages Node-RED. Sélectionnez une passerelle KNX Ultimate pour activer le Mode KNX avec adresses de groupe et DPT. |
| Nom | Ce qu'Alexa & Co. affichent et utilisent pour les commandes vocales |
| Type d'appareil | Le type d'appareil Matter (voir ci-dessous) ; il détermine quels champs d'adresse de groupe apparaissent |
| Lire l'état au démarrage | Envoie un `GroupValue_Read` aux GA d'état au démarrage, pour peupler les attributs Matter |

## Types d'appareil et adresses de groupe

|Type|Adresses de groupe|
|--|--|
| Lumière On/Off, Prise | GA commande On/Off, GA état On/Off (DPT 1.001) |
| Lumière variable | + GA commande/état variation % (DPT 5.001) |
| Lumière RGB (couleur) | + GA commande/état couleur RGB (DPT 232.600). La couleur Matter (hue/saturation ou XY, depuis la roue de couleur de l'app) est convertie depuis/vers le triplet RGB KNX |
| Lumière blanc dynamique | + GA commande/état température de couleur en Kelvin (DPT 7.600) |
| Volet / Store | Monter/Descendre (DPT 1.008), Stop (DPT 1.017), position % commande/état (DPT 5.001), inversion de position optionnelle |
| Thermostat (chauffage et/ou rafraîchissement) | GA température actuelle, GA commande/état consigne (DPT 9.001). En ajoutant aussi la GA commande/état consigne rafraîchissement, le mode Cool (double consigne) est également exposé |
| Climatiseur individuel | Un appareil Matter combine les GA commande/état On/Off (DPT 1.001), température actuelle et consignes chauffage/rafraîchissement (DPT 9.001), et vitesse ventilateur % (DPT 5.001) |
| Ventilateur / VMC | GA commande/état vitesse % (DPT 5.001) |
| Serrure de porte | GA commande verrouillage/déverrouillage et GA état verrouillé/déverrouillé (DPT 1.001 ; `true` = verrouillée) |
| Capteurs (température, humidité, lumière, présence, contact) | Une GA d'état chacun |
| Détecteur fumée/CO | GA état alarme fumée + GA état alarme CO optionnelle (DPT 1.005) : notifications critiques sur le téléphone |
| Détecteur de fuite d'eau | GA état fuite (DPT 1.005) |
| Capteur de qualité d'air (CO2) | GA état CO2 en ppm (DPT 9.008) ; la classe de qualité d'air (bonne/correcte/modérée/mauvaise...) est dérivée automatiquement |
| Robot aspirateur | **Flow uniquement** : pas d'adresses de groupe. Activez les PIN du nœud : les commandes de l'assistant (« lance le nettoyage », pause/reprendre/retour à la base) arrivent sur la sortie comme `rvcmode`/`rvccommand` ; renvoyez l'état avec `msg.payload = { function: "rvcstate", value: "running"\|"docked"\|"charging"\|"paused"\|"error" }` et le mode avec `function: "rvcmode", value: "cleaning"\|"idle"` |

- **GA de commande** : écrite sur le bus KNX quand l'assistant envoie une commande.
- **GA d'état** : lue depuis le bus pour tenir à jour les attributs Matter (et les apps).

## Compatibilité avancée

Ces options ne s'affichent que lorsqu'elles s'appliquent au type sélectionné. Les appareils variables peuvent ignorer la luminosité envoyée juste après `On`. Pour les volets, **Permuter Ouvrir / Fermer** inverse la commande KNX binaire et le sens du pourcentage. **Anti-rebond curseur volet** regroupe les cibles intermédiaires rapides avant l'écriture KNX : `0` utilise des fenêtres adaptatives (400 ms pour la première commande, 150 ms pour les suivantes) ; `1`–`5000` impose une fenêtre fixe. La position Matter peut aussi être mise à jour de façon optimiste puis corrigée par la GA d'état KNX.

## PIN du nœud

Le sélecteur de PIN se trouve hors des onglets de l'éditeur. Son activation affiche juste dessous une section contextuelle **Entrée/sortie du flow**, avec des exemples copiables filtrés selon le type d'appareil :

- **Entrée** : mettez à jour l'état Matter depuis le flux, sans passer par le bus KNX : `msg.payload = { function: "onoff", value: true }` (`function` est l'une de `onoff`, `level`, `rgb`, `colortemp`, `position`, `temperature`, `humidity`, `illuminance`, `occupancy`, `contact`, `currenttemp`, `setpoint`, `coolingsetpoint`, `fanspeed`, `lock`, `smoke`, `co`, `leak`, `co2`, `rvcstate`, `rvcmode`). Utile pour exposer à Alexa & Co. des valeurs calculées dans le flux (ex. un capteur virtuel).
- **Sortie** : chaque commande reçue d'un contrôleur Matter est transmise au flux : `msg.topic` = nom de l'appareil, `msg.payload` = valeur, `msg.matter` = la commande brute. Un appareil sans GA de commande devient un **appareil flow uniquement**.

## Notes

- L'identité Matter de l'appareil est liée à ce nœud : supprimer le nœud et en créer un nouveau fait apparaître un tout nouvel appareil dans les apps.
- Les nœuds d'appareil ajoutés/renommés/supprimés sont pris en compte en quelques secondes, sans réappairer le bridge.
