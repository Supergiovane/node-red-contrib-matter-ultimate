## 文档

节点直接使用 Node-RED 消息：`msg.topic` 标识功能，`msg.payload` 提供数值。无需安装 KNX Ultimate。

选择已配对设备及其端点。编辑器会显示支持的开关、亮度、窗帘、温控或传感器功能。启用端口并填写命令和状态的 topic。

对于灯具，配置亮度命令 topic 后，发送 `msg.topic = "living-room/brightness"` 和 `msg.payload = 60`。状态 topic 输出设备反馈。其他设备类型应使用编辑器列出的功能。

启用输入/输出端口，在命令和状态字段中填写 topic 名称。将 KNX 网关留空；此时不需要 DPT，因此相应字段会隐藏。命令和状态应使用不同的 topic。名称必须精确匹配，不支持通配符。

### KNX 模式

**本包也可以与 KNX Ultimate 配合使用。** 集成为原生功能：安装 `node-red-contrib-knx-ultimate` 并选择其网关，即可启用 **KNX 模式**。同一组映射字段将使用组地址和 DPT，并提供已导入 ETS 项目的地址建议。命令和状态直接通过总线传输，这些映射无需额外的 Function 节点。

选择网关时，请将已保存的 topic 替换为实际组地址，并选择正确的 DPT。已选择的网关离线时，节点仍保持 KNX 模式。要恢复使用 Node-RED 消息，请清空网关并重新配置 topic。

选择已配对设备及其端点。编辑器会显示支持的开关、亮度、窗帘、温控或传感器功能。启用端口并填写命令和状态的 topic。

## 配置

以下参考内容中的组地址和 DPT 适用于 **KNX 模式**。使用 Node-RED 消息时，请在同一组命令/状态字段中填写 topic 名称，无需 DPT。

|字段|说明|
|--|--|
| KNX GW | 使用 Node-RED 消息时留空。选择 KNX Ultimate 网关即可启用 KNX 模式，使用组地址和 DPT。 |
| Matter controller | 设备已在其中配网的 Matter Controller 配置节点。 |
| Matter device | 从已配对设备中选择的 Matter endpoint。UI 会根据真实能力重新构建。 |
| Switch / 插座 / 灯 On-Off | On/Off 命令和状态组地址，通常使用 DPT `1.001`。 |
| 门锁 | DPT `1.xxx` 命令组地址以 `true` 调用 `lockDoor`、以 `false` 调用 `unlockDoor`；独立状态组地址仅接收明确的已上锁/已解锁状态。如端点要求，远程操作 PIN 保存在凭据字段中。端点未声明的命令会被拒绝。 |
| 其他端点 | 插座、开关执行器、窗帘、恒温器、风扇、环境/接点/占用传感器以及电池、功率和电能端点使用多用途映射配置。专用的 **映射** 选项卡仅包含端点实际声明的集群、属性和命令；组地址留空即可禁用。 |
| 灯光控制 | 对灯光 endpoint 使用完整灯光 UI：相对调光（DPT `3.007`）、亮度百分比、RGB/HSV、色温、开灯亮度/温度、日/夜模式、最小/最大调光等级和调光速度。不支持的部分会隐藏。 |
| 传感器 | 传感器 endpoint 只在支持时显示对应测量/状态 GA：温度、湿度、照度、占用、接触和电池。 |
| Read at startup | 在部署/启动或设备重新连接时发布缓存的 Matter 值。 |
| Update local state from KNX write | 当配置的 KNX GA 收到写入 telegram 时，更新本地 Matter/KNX 缓存。 |
| Node Input/Output PINs | 显示 Node-RED 输入/输出端口，并在该字段下方显示 **流程输入** 区域。灯光会显示其支持的顶层灯光状态消息；其他端点会显示简单的 `{function,value}` 格式和高级 Matter 字段。 |

## 流程输入

启用 **Node Input/Output PINs** 后，**流程输入** 区域会直接显示在选择器下方。对于灯光，它提供所支持顶层属性的可复制示例，例如 `msg.on`、`msg.dimming`、`msg.color_temperature` 和 `msg.color`。对于其他端点，该区域根据公布的结构生成，并显示 Endpoint ID、所有可读/可写属性以及接受的命令。未选择 KNX 网关时仍然可用。

简单写入使用 `msg.payload = {function:"position",value:35}`。省略 `value` 即可读取支持的状态，例如 `{function:"temperature"}`；输出使用易懂单位，并在 `msg.matter` 中保留原始详情。`onoff`、`level`、`position`、`open`、`close`、`stop`、设定点、风扇和传感器功能仅在端点公布支持时出现。门锁接受 `{function:"lock",value:true|false}`。

原有高级输入继续有效：使用 `msg.clusterId` 配合 `msg.command`/`msg.args`，或使用 `msg.attribute` 和可选的 `msg.value`。Node ID 和 Endpoint ID 已由节点选择。

## 通用模式

选择 **通用模式** 可监视所有设备。该节点始终有一个输入和一个输出，不使用单个 endpoint 映射。KNX 网关为可选，仅用于电池监视器的报警/文本组地址。

**通用电池监视器** 会缓存完整电池状态。可选 KNX 组地址以 DPT 1.005 输出总报警，并以 DPT 16.001 每 2 秒轮播低电量设备名称。发送 `{payload:{action:"getAllBatteries"}}` 可获取缓存清单。

输出将原始值放在 `msg.payload`，并在 `msg.matter` 中提供路由信息（`source`、`nodeId`、`endpointId`、`clusterId`、属性/事件名称）。输入使用 `msg.nodeId`、`msg.endpointId`、`msg.clusterId`，以及带 `msg.args` 的 `msg.command` 或 `msg.attribute`；添加 `msg.value` 表示写入，省略则读取。这些字段也可放在 `msg.matter` 下。

示例：`{nodeId:"100",endpointId:1,clusterId:6,command:"on",args:{}}` 执行开启；`{nodeId:"100",endpointId:1,clusterId:47,attribute:"batPercentRemaining"}` 读取电池。电池值保留 Matter 原始的半百分比单位，需要百分比时可在 Function 节点中除以二。

## 行为

节点根据 Matter 更新和 KNX 写入维护本地缓存，用该缓存响应 KNX 读取请求，并可在启动时读取/发送值。节点只监听已配置的组地址，因此会忽略无关的 KNX 流量。

每个已配对设备使用独立且有序的命令队列。因此，离线、超时或已移除的设备不会延迟使用同一 KNX 组地址的其他 Matter 设备。仍引用已移除设备的节点会立即拒绝命令，并以红色显示 **Device no longer commissioned**；请选择有效的 Matter 设备，或删除遗留的 Controller 节点。

设备不可用错误会保持锁定：后续 KNX 和 flow 命令将被忽略，且无法覆盖红色状态。一旦该 Matter 设备报告 `connected`，节点会自动恢复；打开节点编辑器也会解除锁定，以便手动重试。
