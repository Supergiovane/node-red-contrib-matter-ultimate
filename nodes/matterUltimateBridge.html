<script type="text/javascript" src="resources/node-red-contrib-matter-ultimate/topicMappingEditor.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-matter-ultimate/11f26b4500.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-matter-ultimate/htmlUtils.js"></script>

<script type="text/javascript">
  (function () {
    // GA fields of each virtual device type.
    // dir 'command' = Matter -> KNX (GA written on assistant commands), 'status' = KNX -> Matter.
    const TYPE_FIELDS = {
      onofflight: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' }
      ],
      onoffplug: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' }
      ],
      dimmablelight: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'Level', labelKey: 'fn_level_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'LevelStatus', labelKey: 'fn_level_status', dptPrefix: '5.', fallbackDpt: '5.001' }
      ],
      rgblight: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'Level', labelKey: 'fn_level_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'LevelStatus', labelKey: 'fn_level_status', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'RGB', labelKey: 'fn_rgb_cmd', dptPrefix: '232.', fallbackDpt: '232.600' },
        { key: 'RGBStatus', labelKey: 'fn_rgb_status', dptPrefix: '232.', fallbackDpt: '232.600' }
      ],
      colortemperaturelight: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'Level', labelKey: 'fn_level_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'LevelStatus', labelKey: 'fn_level_status', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'CT', labelKey: 'fn_ct_cmd', dptPrefix: '7.', fallbackDpt: '7.600' },
        { key: 'CTStatus', labelKey: 'fn_ct_status', dptPrefix: '7.', fallbackDpt: '7.600' }
      ],
      temperaturesensor: [{ key: 'Status', labelKey: 'fn_sensor_ga', dptPrefix: '9.', fallbackDpt: '9.001' }],
      humiditysensor: [{ key: 'Status', labelKey: 'fn_sensor_ga', dptPrefix: '9.', fallbackDpt: '9.007' }],
      lightsensor: [{ key: 'Status', labelKey: 'fn_sensor_ga', dptPrefix: '9.', fallbackDpt: '9.004' }],
      occupancysensor: [{ key: 'Status', labelKey: 'fn_sensor_ga', dptPrefix: '1.', fallbackDpt: '1.011' }],
      contactsensor: [{ key: 'Status', labelKey: 'fn_sensor_ga', dptPrefix: '1.', fallbackDpt: '1.002' }],
      windowcovering: [
        { key: 'UpDown', labelKey: 'fn_updown', dptPrefix: '1.', fallbackDpt: '1.008' },
        { key: 'Stop', labelKey: 'fn_stop', dptPrefix: '1.', fallbackDpt: '1.017' },
        { key: 'Position', labelKey: 'fn_position_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'PositionStatus', labelKey: 'fn_position_status', dptPrefix: '5.', fallbackDpt: '5.001' }
      ],
      thermostat: [
        { key: 'CurrentTemp', labelKey: 'fn_currenttemp', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'Setpoint', labelKey: 'fn_setpoint_cmd', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'SetpointStatus', labelKey: 'fn_setpoint_status', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'CoolingSetpoint', labelKey: 'fn_coolingsetpoint_cmd', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'CoolingSetpointStatus', labelKey: 'fn_coolingsetpoint_status', dptPrefix: '9.', fallbackDpt: '9.001' }
      ],
      roomairconditioner: [
        { key: 'OnOff', labelKey: 'fn_onoff_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'OnOffStatus', labelKey: 'fn_onoff_status', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'CurrentTemp', labelKey: 'fn_currenttemp', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'Setpoint', labelKey: 'fn_setpoint_cmd', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'SetpointStatus', labelKey: 'fn_setpoint_status', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'CoolingSetpoint', labelKey: 'fn_coolingsetpoint_cmd', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'CoolingSetpointStatus', labelKey: 'fn_coolingsetpoint_status', dptPrefix: '9.', fallbackDpt: '9.001' },
        { key: 'FanSpeed', labelKey: 'fn_fanspeed_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'FanSpeedStatus', labelKey: 'fn_fanspeed_status', dptPrefix: '5.', fallbackDpt: '5.001' }
      ],
      doorlock: [
        { key: 'Lock', labelKey: 'fn_lock_cmd', dptPrefix: '1.', fallbackDpt: '1.001' },
        { key: 'LockStatus', labelKey: 'fn_lock_status', dptPrefix: '1.', fallbackDpt: '1.001' }
      ],
      smokecoalarm: [
        { key: 'Smoke', labelKey: 'fn_smoke_ga', dptPrefix: '1.', fallbackDpt: '1.005' },
        { key: 'CO', labelKey: 'fn_co_ga', dptPrefix: '1.', fallbackDpt: '1.005' }
      ],
      waterleakdetector: [{ key: 'Status', labelKey: 'fn_leak_ga', dptPrefix: '1.', fallbackDpt: '1.005' }],
      airqualitysensor: [{ key: 'Status', labelKey: 'fn_co2_ga', dptPrefix: '9.', fallbackDpt: '9.008' }],
      fan: [
        { key: 'FanSpeed', labelKey: 'fn_fanspeed_cmd', dptPrefix: '5.', fallbackDpt: '5.001' },
        { key: 'FanSpeedStatus', labelKey: 'fn_fanspeed_status', dptPrefix: '5.', fallbackDpt: '5.001' }
      ],
      robotvacuum: [] // Flow-only: no GA fields, controlled via the node PINs
    };
    const TYPE_ORDER = ['onofflight', 'dimmablelight', 'rgblight', 'colortemperaturelight', 'onoffplug', 'windowcovering', 'thermostat', 'roomairconditioner', 'fan', 'doorlock', 'temperaturesensor', 'humiditysensor', 'lightsensor', 'occupancysensor', 'contactsensor', 'smokecoalarm', 'waterleakdetector', 'airqualitysensor', 'robotvacuum'];
    const FLOW_HELP = {
      onofflight: { input: [['onoff', true]], output: [['onoff', true]] },
      onoffplug: { input: [['onoff', true]], output: [['onoff', true]] },
      dimmablelight: { input: [['onoff', true], ['level', 50]], output: [['onoff', true], ['level', 50]] },
      rgblight: { input: [['onoff', true], ['level', 50], ['rgb', { red: 255, green: 80, blue: 20 }]], output: [['onoff', true], ['level', 50], ['rgb', { red: 255, green: 80, blue: 20 }]] },
      colortemperaturelight: { input: [['onoff', true], ['level', 50], ['colortemp', 3000]], output: [['onoff', true], ['level', 50], ['colortemp', 3000]] },
      temperaturesensor: { input: [['temperature', 21.5]], output: [] },
      humiditysensor: { input: [['humidity', 45]], output: [] },
      lightsensor: { input: [['illuminance', 500]], output: [] },
      occupancysensor: { input: [['occupancy', true]], output: [] },
      contactsensor: { input: [['contact', true]], output: [] },
      windowcovering: { input: [['position', 35]], output: [['updown', false], ['position', 35], ['stop', true]] },
      thermostat: { input: [['currenttemp', 21.5], ['setpoint', 21], ['coolingsetpoint', 24]], output: [['setpoint', 21], ['coolingsetpoint', 24]] },
      roomairconditioner: { input: [['onoff', true], ['currenttemp', 25.5], ['setpoint', 21], ['coolingsetpoint', 24], ['fanspeed', 60]], output: [['onoff', true], ['setpoint', 21], ['coolingsetpoint', 24], ['fanspeed', 60]] },
      doorlock: { input: [['lock', true]], output: [['lock', true]] },
      smokecoalarm: { input: [['smoke', true], ['co', true]], output: [] },
      waterleakdetector: { input: [['leak', true]], output: [] },
      airqualitysensor: { input: [['co2', 850]], output: [] },
      fan: { input: [['fanspeed', 60]], output: [['fanspeed', 60]] },
      robotvacuum: {
        input: [['rvcstate', 'charging'], ['rvcmode', 'idle']],
        output: [['rvccommand', 'gohome'], ['rvccommand', 'pause'], ['rvccommand', 'resume'], ['rvcmode', 'cleaning']]
      }
    };

    // Every GA/DPT key across all types, used to declare the node defaults.
    const ALL_KEYS = [];
    Object.keys(TYPE_FIELDS).forEach((t) => TYPE_FIELDS[t].forEach((f) => { if (ALL_KEYS.indexOf(f.key) === -1) ALL_KEYS.push(f.key); }));
    const gaDefaults = {
      server: { type: 'knxUltimate-config', required: false },
      serverMatterBridge: { type: 'matter-ultimate-bridge-config', required: true },
      name: { value: '' },
      deviceType: { value: 'onofflight' },
      invertPosition: { value: false },
      coverSwapOpenClose: { value: false },
      coverSliderDebounceMs: { value: 0 },
      commandDedupMs: { value: 1200 },
      turnOnBehavior: { value: 'ignoreLevelAfterOn' },
      ignoreLevelAfterOnMs: { value: 800 },
      coverUpdateMode: { value: 'optimistic' },
      coverStatusTimeoutMs: { value: 3000 },
      readStatusAtStartup: { value: 'yes' },
      enableNodePINS: { value: 'no' },
      outputs: { value: 0 },
      inputs: { value: 0 }
    };
    ALL_KEYS.forEach((key) => {
      gaDefaults['ga' + key] = { value: '' };
      gaDefaults['dpt' + key] = { value: '' };
    });

    RED.nodes.registerType('matterUltimateBridge', {
      category: 'Matter Ultimate',
      color: '#E8A5A5',
      defaults: gaDefaults,
      inputs: 0,
      outputs: 0,
      icon: 'node-matter-bridge-icon.svg',
      label() {
        return this.name || 'Expose to Matter';
      },
      paletteLabel: 'Expose to Matter',
      oneditprepare() {
        try { RED.sidebar.show('help'); } catch (error) { /* empty */ }
        const node = this;

        // Keep the same left-hand vertical tab orientation as Matter Controller.
        if ($('#matterUltimateControllerVerticalTabs').length === 0) {
          $('head').append(`
            <style id="matterUltimateControllerVerticalTabs">
              .hue-vertical-tabs.ui-tabs.ui-widget.ui-widget-content.ui-corner-all {
                display: flex;
                border: none;
                padding: 0;
              }
              .hue-vertical-tabs > ul.ui-tabs-nav {
                flex: 0 0 180px;
                border-right: 1px solid #ccc;
                border-left: none;
                border-top: none;
                border-bottom: none;
                padding: 0.5em 0.3em;
              }
              .hue-vertical-tabs > ul.ui-tabs-nav li {
                float: none;
                width: 100%;
                margin: 0 0 2px 0;
              }
              .hue-vertical-tabs > ul.ui-tabs-nav li a {
                display: block;
                width: 100%;
                white-space: normal;
                position: relative;
                border-bottom: none !important;
              }
              .hue-vertical-tabs > ul.ui-tabs-nav li.ui-tabs-active {
                border-bottom: none !important;
              }
              .hue-vertical-tabs > ul.ui-tabs-nav li.ui-tabs-active a::after {
                content: "";
                position: absolute;
                left: 0;
                bottom: 0;
                width: 50%;
                height: 3px;
                background: currentColor;
              }
              .hue-vertical-tabs .ui-tabs-panel {
                flex: 1;
                padding: 0.8em 1em;
                box-sizing: border-box;
                border: none;
                background: transparent;
              }
              .hue-vertical-tabs .form-row > dt {
                flex: 1 1 auto;
                margin: 0;
              }
              .hue-vertical-tabs hr {
                width: 100%;
                border: 0;
                border-top: 1px solid #ccc;
                margin: 8px 0;
              }
              .matter-bridge-flow-help-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 12px;
              }
              .matter-bridge-flow-help-table th,
              .matter-bridge-flow-help-table td {
                border-bottom: 1px solid #ddd;
                padding: 7px 6px;
                text-align: left;
                vertical-align: top;
              }
              .matter-bridge-flow-help-table code {
                white-space: pre-wrap;
                word-break: break-word;
              }
              .matter-bridge-flow-help-copy {
                white-space: nowrap;
              }
            </style>`);
        }
        const $tabs = $('#mb-tabs');
        $tabs.addClass('hue-vertical-tabs');
        $tabs.tabs();
        $tabs.find('ul').addClass('ui-tabs-nav');
        $tabs.find('li').removeClass('ui-corner-top').addClass('ui-corner-left');

        // Resolves the KNX gateway at query time: the selected one, or - as a
        // fallback - the first knxUltimate-config available, so the GA list works
        // even before the user picks the gateway on this device node.
        const findKnxGateway = () => {
          let srv = null;
          try {
            const val = $('#node-input-server').val();
            if (val && val !== '_ADD_') srv = RED.nodes.node(val);
          } catch (error) { /* empty */ }
          if (!srv) {
            try {
              RED.nodes.eachConfig((c) => { if (!srv && c.type === 'knxUltimate-config') srv = c; });
            } catch (error) { /* empty */ }
          }
          return srv;
        };

        // Auto-select the KNX gateway when there is only one, sparing the user a click per device node
        try {
          const cur = $('#node-input-server').val();
          if (!cur || cur === '_ADD_') {
            const gws = [];
            RED.nodes.eachConfig((c) => { if (c.type === 'knxUltimate-config') gws.push(c); });
            if (gws.length === 1) $('#node-input-server').val(gws[0].id).trigger('change');
          }
        } catch (error) { /* empty */ }

        // Device type dropdown
        const $type = $('#node-input-deviceType');
        TYPE_ORDER.forEach((t) => {
          $type.append($('<option></option>').attr('value', t).text(node._('matterUltimateBridge.types.' + t)));
        });
        $type.val(node.deviceType || 'onofflight');

        // Compact "list" layout: a small gray caption above each input, fields wrapping
        // on one or more rows (same pattern used across the rest of the KNX-Ultimate nodes).
        const $fields = $('#mb-ga-fields').css({ display: 'flex', flexWrap: 'wrap', alignItems: 'flex-end', gap: '10px' });
        const $invertRow = $('#mb-invert-row');
        const $advancedRows = $('#mb-compatibility-options');
        const $commandAdvancedRows = $('.mb-command-advanced-row');
        const $dimmerAdvancedRows = $('.mb-dimmer-advanced-row');
        const $coverAdvancedRows = $('.mb-cover-advanced-row');
        const $pinSelect = $('#node-input-enableNodePINS');
        const $flowHelp = $('#matter-bridge-flow-help');
        const $nameInput = $('#node-input-name');
        const gaInputs = {};

        function createLabeledField(row, element, options = {}) {
          const wrapper = $('<div/>', {
            style: 'display:flex; flex-direction:column; margin-bottom:8px;'
          }).appendTo(row);
          if (options.width) wrapper.css('width', options.width);
          const $labelSpan = $('<span/>', {
            style: 'font-size:11px; color:#666; margin-bottom:2px; white-space:nowrap;'
          }).appendTo(wrapper);
          element.css('width', '100%');
          element.appendTo(wrapper);
          return { wrapper, $labelSpan };
        }

        function attachGaAutocomplete($ga, $dpt, fieldDef) {
          $ga.autocomplete({
            minLength: 0,
            source(request, response) {
              const gw = findKnxGateway();
              if (!gw) { response([]); return; }
              $.getJSON(`knxUltimatecsv?nodeID=${gw.id}`, (data) => {
                response($.map(data, (value) => {
                  const search = `${value.ga} (${value.devicename}) DPT${value.dpt}`;
                  if (htmlUtilsfullCSVSearch(search, `${request.term} ${fieldDef.dptPrefix}`)) {
                    return { label: `${value.ga} # ${value.devicename} # ${value.dpt}`, value: value.ga, dpt: value.dpt };
                  }
                  return null;
                }));
              });
            },
            select(event, ui) { $dpt.val(ui.item.dpt || fieldDef.fallbackDpt); }
          });
          $ga.on('focus.matterUltimateBridge click.matterUltimateBridge', function () {
            try { $(this).autocomplete('search', ''); } catch (error) { /* empty */ }
          });
          try {
            const gw = findKnxGateway();
            if (gw && gw.id) KNX_enableSecureFormatting($ga, gw.id);
          } catch (error) { /* empty */ }
        }

        // Build one field per possible GA key; show only the ones of the selected type.
        ALL_KEYS.forEach((key) => {
          const fieldDef = {};
          Object.keys(TYPE_FIELDS).forEach((t) => { const f = TYPE_FIELDS[t].find((x) => x.key === key); if (f) Object.assign(fieldDef, f); });
          const $ga = $('<input/>', { type: 'text', class: 'ultimate-mapped-address', placeholder: '1/1/1' }).val(node['ga' + key] || '');
          const $dpt = $('<input/>', { type: 'hidden' }).val(node['dpt' + key] || '');
          const { wrapper, $labelSpan } = createLabeledField($fields, $ga, { width: '150px' });
          wrapper.append($dpt); // Kept alongside the GA input; never rendered.
          attachGaAutocomplete($ga, $dpt, fieldDef);
          // Keyed by field key (not DOM position), so save is robust regardless of layout.
          gaInputs[key] = { wrapper, $ga, $dpt, $labelSpan };
        });

        const inputMessageCode = (fn, value) => `msg.payload = ${JSON.stringify({ function: fn, value }, null, 2)};\nreturn msg;`;
        const outputMessageCode = (fn, value) => JSON.stringify({
          topic: ($nameInput.val() || node.name || 'Matter device').toString(),
          payload: value,
          matter: { fn, value }
        }, null, 2);
        const appendFlowHelpRow = ($body, fn, code) => {
          const $row = $('<tr></tr>');
          $('<td><code></code></td>').find('code').text(fn).end().appendTo($row);
          $('<td><code></code></td>').find('code').text(code).end().appendTo($row);
          $('<td></td>').append(
            $('<button type="button" class="red-ui-button matter-bridge-flow-help-copy"><i class="fa fa-copy"></i></button>')
              .attr('title', node._('matterUltimateBridge.flow_help.copy') || 'Copy')
              .data('copy-text', code)
          ).appendTo($row);
          $body.append($row);
        };
        const copyFlowHelpText = (value) => {
          const copied = () => RED.notify(node._('matterUltimateBridge.flow_help.copied') || 'Message copied', 'success');
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(value).then(copied).catch(() => {
              const $temporary = $('<textarea></textarea>').val(value).appendTo('body').select();
              try { document.execCommand('copy'); copied(); } finally { $temporary.remove(); }
            });
            return;
          }
          const $temporary = $('<textarea></textarea>').val(value).appendTo('body').select();
          try { document.execCommand('copy'); copied(); } finally { $temporary.remove(); }
        };
        const renderFlowHelp = () => {
          const examples = FLOW_HELP[$type.val()] || { input: [], output: [] };
          const $inputBody = $('#matter-bridge-flow-help-input-body').empty();
          const $outputBody = $('#matter-bridge-flow-help-output-body').empty();
          examples.input.forEach(([fn, value]) => appendFlowHelpRow($inputBody, fn, inputMessageCode(fn, value)));
          examples.output.forEach(([fn, value]) => appendFlowHelpRow($outputBody, fn, outputMessageCode(fn, value)));
          $('#matter-bridge-flow-help-input-empty').toggle(examples.input.length === 0);
          $('#matter-bridge-flow-help-output-empty').toggle(examples.output.length === 0);
          $('#matter-bridge-flow-help-output-table').toggle(examples.output.length > 0);
        };
        const updateFlowHelpVisibility = () => {
          const visible = $pinSelect.val() === 'yes';
          $flowHelp.toggle(visible);
          if (visible) renderFlowHelp();
        };

        function updateTypePresentation() {
          const selected = $type.val();
          const active = TYPE_FIELDS[selected] || [];
          ALL_KEYS.forEach((key) => {
            const entry = gaInputs[key];
            const fieldForType = active.find((f) => f.key === key);
            if (fieldForType) {
              entry.wrapper.show();
              entry.$labelSpan.text(node._('matterUltimateBridge.functions.' + fieldForType.labelKey));
            } else {
              entry.wrapper.hide();
            }
          });
          $invertRow.toggle(selected === 'windowcovering');
          const hasLevel = selected === 'dimmablelight' || selected === 'rgblight' || selected === 'colortemperaturelight';
          const isCover = selected === 'windowcovering';
          // The Alexa duplicate-command dedup applies to any device that emits On/Off or
          // level commands (plain on/off lights and plugs included), not just dimmers.
          const hasCommand = selected === 'onofflight' || selected === 'onoffplug' || selected === 'roomairconditioner' || hasLevel;
          $advancedRows.toggle(hasCommand || isCover);
          $commandAdvancedRows.toggle(hasCommand);
          $dimmerAdvancedRows.toggle(hasLevel);
          $coverAdvancedRows.toggle(isCover);
          updateFlowHelpVisibility();
        }
        const updateTopicMode = () => {
          const value = String($('#node-input-server').val() || '').trim().toLowerCase();
          window.UltimateTopicMappingEditor.apply($, $('#mb-ga-fields'), ['', 'none', '_add_', '__none__'].includes(value), node);
        };
        $('#node-input-server').on('change.ultimateTopicMode', updateTopicMode);
        $type.on('change', updateTypePresentation);
        updateTypePresentation();

        // oneditsave reads the GA values straight from these references: no DOM
        // position matching, so it cannot break if the layout changes again.
        node._matterGaInputs = gaInputs;

        $('#node-input-invertPosition').prop('checked', node.invertPosition === true);
        $('#node-input-coverSwapOpenClose').prop('checked', node.coverSwapOpenClose === true);
        $('#node-input-coverSliderDebounceMs').val(node.coverSliderDebounceMs === undefined ? 0 : node.coverSliderDebounceMs);
        $('#node-input-commandDedupMs').val(node.commandDedupMs === undefined ? 1200 : node.commandDedupMs);
        $('#node-input-turnOnBehavior').val(node.turnOnBehavior || 'ignoreLevelAfterOn');
        $('#node-input-ignoreLevelAfterOnMs').val(node.ignoreLevelAfterOnMs === undefined ? 800 : node.ignoreLevelAfterOnMs);
        $('#node-input-coverUpdateMode').val(node.coverUpdateMode || 'optimistic');
        $('#node-input-coverStatusTimeoutMs').val(node.coverStatusTimeoutMs === undefined ? 3000 : node.coverStatusTimeoutMs);
        $('#node-input-readStatusAtStartup').val(node.readStatusAtStartup || 'yes');
        $pinSelect.val(node.enableNodePINS || 'no');
        updateTopicMode();
        $pinSelect.on('change.matterUltimateBridge', updateFlowHelpVisibility);
        $nameInput.on('change.matterUltimateBridge input.matterUltimateBridge', () => {
          if ($flowHelp.is(':visible')) renderFlowHelp();
        });
        $flowHelp.off('click.matterUltimateBridge').on('click.matterUltimateBridge', '.matter-bridge-flow-help-copy', function () {
          copyFlowHelpText($(this).data('copy-text') || '');
        });
        updateFlowHelpVisibility();
      },
      oneditsave() {
        try { RED.sidebar.show('info'); } catch (error) { /* empty */ }
        const node = this;
        const selected = $('#node-input-deviceType').val();
        node.deviceType = selected;
        node.invertPosition = $('#node-input-invertPosition').is(':checked');
        node.coverSwapOpenClose = $('#node-input-coverSwapOpenClose').is(':checked');
        const active = TYPE_FIELDS[selected] || [];
        const gaInputs = node._matterGaInputs || {};
        // Clear every GA/DPT, then write only the ones of the selected type, reading
        // straight from the field references built in oneditprepare (not DOM position).
        ALL_KEYS.forEach((key) => {
          node['ga' + key] = '';
          node['dpt' + key] = '';
          const entry = gaInputs[key];
          if (!entry) return;
          const isActive = active.some((f) => f.key === key);
          const ga = (entry.$ga.val() || '').trim();
          if (isActive && ga !== '') {
            node['ga' + key] = ga;
            node['dpt' + key] = (entry.$dpt.val() || '').trim();
          }
        });
        delete node._matterGaInputs;
        // Keep an explicit 0 (dedup disabled); treat only an empty/invalid field as the default.
        const dedupRaw = $('#node-input-commandDedupMs').val();
        this.commandDedupMs = (dedupRaw === '' || dedupRaw === null || isNaN(Number(dedupRaw))) ? 1200 : Math.max(0, Number(dedupRaw));
        const coverDebounceRaw = $('#node-input-coverSliderDebounceMs').val();
        this.coverSliderDebounceMs = (coverDebounceRaw === '' || coverDebounceRaw === null || isNaN(Number(coverDebounceRaw))) ? 0 : Math.min(5000, Math.max(0, Number(coverDebounceRaw)));
        this.turnOnBehavior = $('#node-input-turnOnBehavior').val() || 'ignoreLevelAfterOn';
        this.ignoreLevelAfterOnMs = Number($('#node-input-ignoreLevelAfterOnMs').val()) || 0;
        this.coverUpdateMode = $('#node-input-coverUpdateMode').val() || 'optimistic';
        this.coverStatusTimeoutMs = Number($('#node-input-coverStatusTimeoutMs').val()) || 0;
        this.enableNodePINS = $('#node-input-enableNodePINS').val() || 'no';
        this.outputs = this.enableNodePINS === 'yes' ? 1 : 0;
        this.inputs = this.enableNodePINS === 'yes' ? 1 : 0;
      },
      oneditcancel() {
        try { RED.sidebar.show('info'); } catch (error) { /* empty */ }
        delete this._matterGaInputs;
      }
    });
  }());
</script>

<script type="text/markdown" data-help-name="matterUltimateBridge">
## Documentation

The nodes work directly with Node-RED messages: `msg.topic` identifies the function and `msg.payload` carries its value. KNX Ultimate is not required.

Select the bridge configuration and a device type, then enable the pins. Input messages on **status topics** update the virtual device; commands from the Matter app leave the output on **command topics**. In **KNX mode**, app commands are written to command group addresses and KNX status addresses update the app.

Example: send `msg.topic = "living-room/light/status"`, `msg.payload = true` to report that a lamp is on. An app command appears as `msg.topic = "living-room/light/command"` with a boolean payload. Connect it to your actual device logic and return the confirmed state.

Enable the input/output pins and enter topic names in the command and state fields. Leave the KNX gateway empty; DPT fields are hidden because they are not needed. Use separate command and state topics. Matching is exact; wildcards are not supported.

### KNX mode

**You can also use this package with KNX Ultimate.** The integration is native: install `node-red-contrib-knx-ultimate` and select its gateway to enable **KNX mode**. The same mapping fields then use group addresses and DPTs, with suggestions from the imported ETS project. Commands and feedback pass directly over the bus; no intermediate Function node is needed for these mappings.

When selecting a gateway, replace the saved topics with real group addresses and choose the correct DPTs. A selected gateway that is offline leaves the node in KNX mode. To return to Node-RED messages, clear the gateway and configure the topics again.

[Nodes](https://supergiovane.github.io/node-red-contrib-matter-ultimate/en/nodes.html) · [Examples](https://supergiovane.github.io/node-red-contrib-matter-ultimate/en/examples.html)


---

## Overview

Each Matter Bridge device node exposes a device managed by your Node-RED flow as a Matter device. Connect it to a **Matter Bridge** configuration, pair that bridge with your Matter app, and connect the node’s input/output to your device logic. Multiple device nodes can share the bridge.

**Matter Controller** sends commands to real Matter devices. **Matter Bridge** exposes devices from your flow to a Matter app. You can also connect either to KNX through KNX Ultimate.

Changing the device type after the bridge has been paired changes the Matter endpoint structure. Controllers may keep the old endpoint as unreachable; in that case reset/re-pair the bridge or create a new exposed device.

## Configuration

Group addresses and DPTs in the reference below apply to **KNX mode**. For Node-RED messages, use topic names in the same command/state fields; DPTs are not needed.

|Field|Description|
|--|--|
| Matter bridge | The Matter Bridge configuration node this device belongs to |
| KNX GW | Leave empty for Node-RED messages. Select a KNX Ultimate gateway to enable KNX mode and use group addresses and DPTs. |
| Name | What Alexa & Co. show and use for voice commands |
| Device type | The Matter device type (see below); it drives which group address fields appear |
| Read status at startup | Sends a `GroupValue_Read` to the status GAs at startup, so the Matter attributes are populated |

## Device types and group addresses

|Type|Group addresses|
|--|--|
| On/Off light, Plug | On/Off command GA, On/Off status GA (DPT 1.001) |
| Dimmable light | + Dimming % command/status GA (DPT 5.001) |
| RGB color light | + RGB color command/status GA (DPT 232.600). The Matter color (hue/saturation or XY, from the app color wheel) is converted to/from the KNX RGB triplet |
| Tunable white light | + Color temperature command/status GA in Kelvin (DPT 7.600) |
| Cover / Shutter | Up/Down (DPT 1.008), Stop (DPT 1.017), Position % command/status (DPT 5.001), optional position inversion |
| Thermostat (heating and/or cooling) | Current temperature GA, Setpoint command/status GA (DPT 9.001). Optionally add a Cooling setpoint command/status GA to also expose a Cool mode (dual-setpoint) |
| Room air conditioner | One Matter device combining On/Off (DPT 1.001), current temperature and heating/cooling setpoints (DPT 9.001), and fan speed % (DPT 5.001) command/status GAs |
| Fan / Ventilation | Fan speed % command/status GA (DPT 5.001) |
| Door lock | Lock/Unlock command GA and Locked/Unlocked status GA (DPT 1.001; `true` = locked) |
| Sensors (temperature, humidity, light, occupancy, contact) | One status GA each |
| Smoke/CO alarm | Smoke alarm status GA + optional CO alarm status GA (DPT 1.005): critical notifications on the phone |
| Water leak detector | Leak status GA (DPT 1.005) |
| Air quality sensor (CO2) | CO2 status GA in ppm (DPT 9.008); the air quality class (good/fair/moderate/poor...) is derived automatically |
| Robot vacuum | **Flow-only**: no group addresses. Enable the node PINs: assistant commands ("start cleaning", pause/resume/go home) arrive on the output as `rvcmode`/`rvccommand`; report the state back with `msg.payload = { function: "rvcstate", value: "running"|"docked"|"charging"|"paused"|"error" }` and the mode with `function: "rvcmode", value: "cleaning"|"idle"` |

- **Command GA**: written to the KNX bus when the assistant sends a command.
- **Status GA**: read from the bus to keep the Matter attributes (and the apps) updated.

## Advanced compatibility

These options are hidden unless they apply to the selected type. Dimmable devices can ignore the brightness command that some controllers send immediately after `On`. For covers, **Swap Open / Close** reverses both the binary KNX command and percentage direction. **Cover slider debounce** coalesces rapid intermediate targets before writing to KNX: `0` uses adaptive windows (400 ms for the first command, 150 ms for subsequent commands); `1`–`5000` forces one fixed window. Covers can also optimistically update the Matter position after a command, then correct it when the KNX status GA reports the real position.

## Node PINs

The PIN selector is outside the editor tabs. Enabling it reveals a contextual **Flow input/output** section directly below, with copyable examples filtered to the selected device type:

- **Input**: update the Matter state from the flow, without the KNX bus: `msg.payload = { function: "onoff", value: true }` (`function` is one of `onoff`, `level`, `rgb`, `colortemp`, `position`, `temperature`, `humidity`, `illuminance`, `occupancy`, `contact`, `currenttemp`, `setpoint`, `coolingsetpoint`, `fanspeed`, `lock`, `smoke`, `co`, `leak`, `co2`, `rvcstate`, `rvcmode`). Useful to expose flow-computed values (e.g. a virtual sensor) to Alexa & Co.
- **Output**: every command received from a Matter controller is forwarded to the flow: `msg.topic` = device name, `msg.payload` = value, `msg.matter` = the raw command. A device without command GAs becomes a **flow-only device**.

## Notes

- The Matter identity of the device is tied to this node: deleting the node and creating a new one makes the apps see a brand-new device.
- Added/renamed/removed device nodes are picked up by the paired controllers within seconds, without re-pairing the bridge.
</script>
